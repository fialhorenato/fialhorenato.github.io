title: Renato Fialho
title_separator: "—"
subtitle: Software engineer · Amsterdam
description: >-
  Software engineer building reliable systems and writing about technology,
  engineering, and the things I’m learning.
baseurl: ""
url: "https://www.renatofialho.com"
repository: fialhorenato/fialhorenato.github.io
logo: /images/profile.jpg
locale: en
minimal_mistakes_skin: air

permalink: /blog/:title
timezone: Europe/Amsterdam
search: true
search_full_content: true
breadcrumbs: true
words_per_minute: 200

author:
  name: Renato Fialho
  avatar: /images/profile.jpg
  bio: Software engineer at Booking.com in Amsterdam.
  location: Amsterdam, Netherlands
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/fialhorenato
    - label: LinkedIn
      icon: fab fa-fw fa-linkedin
      url: https://www.linkedin.com/in/renatofialho

social:
  type: Person
  name: Renato Fialho
  links:
    - https://github.com/fialhorenato
    - https://www.linkedin.com/in/renatofialho

comments:
  provider: disqus
  disqus:
    shortname: renatofialho

footer:
  since: 2020
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/fialhorenato
    - label: LinkedIn
      icon: fab fa-fw fa-linkedin
      url: https://www.linkedin.com/in/renatofialho

remote_theme: mmistakes/minimal-mistakes@4.28.1

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

include:
  - _pages

exclude:
  - vendor
  - node_modules

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      share: true
      related: true
      toc: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      classes: wide

sass:
  sass_dir: _sass
  style: compressed
