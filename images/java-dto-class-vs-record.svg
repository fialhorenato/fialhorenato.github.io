<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Traditional Java DTO compared with a record</title>
  <desc id="desc">Both declarations model the same name and price. The regular class spells out fields, constructor, accessors, and value methods, while the record declares its components directly.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f7ff"/><stop offset="1" stop-color="#e8edff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dy="8" stdDeviation="12" flood-color="#192b55" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#bg)"/>
  <text x="72" y="70" font-family="system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#4169e1">SAME DATA, DIFFERENT AMOUNT OF CEREMONY</text>
  <rect x="72" y="112" width="620" height="378" rx="20" fill="#111c3d" filter="url(#shadow)"/>
  <rect x="748" y="112" width="620" height="378" rx="20" fill="#111c3d" filter="url(#shadow)"/>
  <path d="M72 160h620M748 160h620" stroke="#263660" stroke-width="2"/>
  <circle cx="105" cy="137" r="8" fill="#ff625c"/><circle cx="131" cy="137" r="8" fill="#ffbd44"/><circle cx="157" cy="137" r="8" fill="#00ca56"/>
  <circle cx="781" cy="137" r="8" fill="#ff625c"/><circle cx="807" cy="137" r="8" fill="#ffbd44"/><circle cx="833" cy="137" r="8" fill="#00ca56"/>
  <g font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#d9e4ff"><text x="187" y="144">Traditional class · 35+ lines</text><text x="863" y="144">Record · 1 declaration</text></g>
  <g font-family="SFMono-Regular,Consolas,monospace" font-size="17" fill="#cbd5e1">
    <text x="104" y="205" fill="#83a6ff">public class ProductRequest {</text>
    <text x="128" y="239">private final String name;</text>
    <text x="128" y="273">private final BigDecimal price;</text>
    <text x="128" y="307">public ProductRequest(String name,</text>
    <text x="152" y="341">BigDecimal price) {</text>
    <text x="152" y="375">this.name = name;</text>
    <text x="152" y="409">this.price = price;</text>
    <text x="128" y="443">}</text><text x="104" y="477" fill="#83a6ff">// accessors, equals, hashCode…</text>
    <text x="780" y="225" fill="#83a6ff">public record ProductRequest(</text>
    <text x="816" y="270" fill="#71ded0">String name,</text>
    <text x="816" y="315" fill="#71ded0">BigDecimal price</text>
    <text x="780" y="360" fill="#83a6ff">) {}</text>
    <text x="780" y="422" fill="#91e6b0">// constructor, accessors, value methods</text>
    <text x="780" y="456" fill="#91e6b0">// are generated by the compiler</text>
  </g>
  <text x="720" y="530" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#52617d">Less boilerplate; the data contract stays explicit.</text>
</svg>
