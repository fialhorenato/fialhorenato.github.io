<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">A record is shallowly immutable</title>
  <desc id="desc">The record's items reference cannot be reassigned, but the referenced mutable list can still change. A defensive List.copyOf copy makes the list unmodifiable.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f7ff"/><stop offset="1" stop-color="#e8edff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4169e1"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dy="7" stdDeviation="10" flood-color="#192b55" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1440" height="500" rx="28" fill="url(#bg)"/>
  <text x="72" y="68" font-family="system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#4169e1">IMMUTABILITY HAS A BOUNDARY</text>
  <g filter="url(#shadow)"><rect x="90" y="133" width="420" height="230" rx="20" fill="#fff"/><rect x="580" y="133" width="300" height="230" rx="20" fill="#fff"/><rect x="950" y="133" width="400" height="230" rx="20" fill="#fff"/></g>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><text x="300" y="183" font-size="18" font-weight="700" fill="#172554">Record component</text><text x="730" y="183" font-size="18" font-weight="700" fill="#172554">Referenced object</text><text x="1150" y="183" font-size="18" font-weight="700" fill="#172554">Defensive copy</text>
  <text x="300" y="240" font-family="monospace" font-size="18" fill="#4169e1">Cart.items</text><text x="300" y="276" font-size="15" fill="#52617d">reference cannot be reassigned</text><text x="730" y="235" font-family="monospace" font-size="18" fill="#c65151">Mutable List</text><text x="730" y="274" font-size="15" fill="#52617d">contents can still change</text><text x="1150" y="235" font-family="monospace" font-size="17" fill="#23845a">List.copyOf(items)</text><text x="1150" y="274" font-size="15" fill="#52617d">unmodifiable snapshot</text></g>
  <path d="M510 248h66M880 248h62" stroke="#4169e1" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="230" y="407" width="980" height="52" rx="16" fill="#fff1f1"/>
  <text x="720" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#a52d36">A final reference does not make the referenced object immutable.</text>
</svg>
