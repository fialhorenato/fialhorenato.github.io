<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">From HTTP JSON to a validated Java record</title>
  <desc id="desc">A request travels from JSON through deserialization, record construction and Bean Validation, then reaches the controller and service only when valid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f7ff"/><stop offset="1" stop-color="#e9efff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18305e" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4169e1"/></marker>
  </defs>
  <rect width="1440" height="420" rx="28" fill="url(#bg)"/>
  <text x="72" y="62" font-family="system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#4169e1">REQUEST LIFECYCLE</text>
  <g font-family="system-ui,sans-serif" filter="url(#shadow)">
    <rect x="72" y="120" width="235" height="150" rx="18" fill="#fff"/><rect x="342" y="120" width="235" height="150" rx="18" fill="#fff"/><rect x="612" y="120" width="235" height="150" rx="18" fill="#fff"/><rect x="882" y="120" width="235" height="150" rx="18" fill="#fff"/><rect x="1152" y="120" width="235" height="150" rx="18" fill="#fff"/>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g fill="#4169e1"><circle cx="106" cy="154" r="17"/><circle cx="376" cy="154" r="17"/><circle cx="646" cy="154" r="17"/><circle cx="916" cy="154" r="17"/><circle cx="1186" cy="154" r="17"/></g>
    <g fill="#fff" font-size="15" font-weight="700"><text x="106" y="160">1</text><text x="376" y="160">2</text><text x="646" y="160">3</text><text x="916" y="160">4</text><text x="1186" y="160">5</text></g>
    <g fill="#172554" font-size="20" font-weight="700"><text x="189" y="205">HTTP JSON</text><text x="459" y="205">Jackson</text><text x="729" y="205">Java record</text><text x="999" y="205">Bean Validation</text><text x="1269" y="205">Controller → service</text></g>
    <g fill="#52617d" font-size="15"><text x="189" y="234">Untrusted input</text><text x="459" y="234">Deserialization</text><text x="729" y="234">Canonical constructor</text><text x="999" y="234">@Valid + constraints</text><text x="1269" y="234">Valid request only</text></g>
  </g>
  <g stroke="#4169e1" stroke-width="3" marker-end="url(#arrow)"><path d="M307 195h27"/><path d="M577 195h27"/><path d="M847 195h27"/><path d="M1117 195h27"/></g>
  <path d="M999 270v55h-310" fill="none" stroke="#d54848" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <rect x="505" y="330" width="300" height="48" rx="14" fill="#fff1f1"/>
  <text x="655" y="360" font-family="system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#a52d36">Invalid → 400 response</text>
</svg>
